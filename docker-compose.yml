services:
  db:
    image: postgres:14-alpine
    restart: always
    environment:
      POSTGRES_PASSWORD: ${DB_PASS}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_DB: ${DB_NAME}
      PGDATA: /var/lib/postgresql/data
    volumes:
      - ./postgresdata:/var/lib/postgresql/data

  backend:
    restart: always
    build:
      context: .
      args:
        USER_UNIX_ID: ${USER_UNIX_ID:-1000}
    ports:
      - ${BACKEND_EXPOSE_PORT}:8000
    depends_on:
      - db
    env_file: .env
    # El código va dentro de la imagen; solo se montan los archivos subidos y
    # los estáticos (collectstatic los escribe acá y nginx los sirve).
    volumes:
      - ./backend/media:/app/media
      - ./backend/static:/app/static

  nginx:
    image: nginx:1.30-alpine
    restart: always
    ports:
      - ${FRONTEND_EXPOSE_PORT}:8000
    volumes:
      - ./config/nginx:/etc/nginx/conf.d
      - ./backend/static:/static
      - ./backend/media:/media
